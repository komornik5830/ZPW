<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>strona jquery</title>
    <script>
       $(function(){

        let karty = 0;

        $("#dodaj").click(function(){
            
            let div = document.createElement("div");

            let backgroundR = Math.floor((Math.random() * 255));
            let backgroundG = Math.floor((Math.random() * 255));
            let backgroundB = Math.floor((Math.random() * 255));

            let number = Math.floor((Math.random() * 99) + 1);
            let width =  Math.floor((Math.random() * 150) + 100);
            let height = Math.floor((Math.random() * 150) + 100);

            $(div).css({
                "background-color":`rgb(${backgroundR}, ${backgroundG}, ${backgroundB})`,
                "width":width,
                "height":height

            })

            $(div).text(number);
            $(div).addClass("karta");

            $("#container").append(div);
            karty++;
            $("#karty").text("utworzone karty: " + karty)

        })

        $("#usun").click(function(){
            $(".karta").each(function(){
                $(this).remove();
            })
            karty = 0;
             $("#karty").text("utworzone karty: " + karty)


        })

        $("#container").on("click", ".karta", (function(){
                if($(this).text() % 2 == 0){
                    $(this).css("background-color","blue");
                }else if($(this).text() % 2 == 1){
                    $(this).css("background-color","red");
                }
            }))

            $("#container").on("dblclick", ".karta", (function(){
                $(this).remove();
                karty--;
                $("#karty").text(`Utworzone kart: ${karty}`);
            }))
          

        })

        


    </script>

    <style>
      

    </style>
</head>
<body>

    <button id="dodaj" type="submit">dodaj kartę</button>
    <button id="usun" type="submit">usuń wszystkie</button>
    <p id="karty">utworzone karty: </p>

    <div id="container"></div>

    


    

    
    
</body>
</html>
